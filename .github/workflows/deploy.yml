# Deploy IC Design Hub lên GitHub Pages
# push main → provenance check → validate → build → deploy
#
# YÊU CẦU MỘT LẦN trên GitHub: Settings → Pages → Build and deployment
#   → Source: "GitHub Actions" (KHÔNG phải "Deploy from a branch")
# Chi tiết: docs/DEPLOYMENT.md
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hằng ngày 22:00 UTC (≈ 5:00 sáng giờ Việt Nam): lấy tin mới cho trang /news/
    # rồi build + deploy lại. Lưu ý của GitHub: scheduled workflow tự tắt nếu repo
    # không có hoạt động nào trong 60 ngày — vào tab Actions bấm Enable lại là chạy tiếp.
    - cron: "0 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# không cho hai lần deploy chồng nhau; không hủy run đang chạy giữa chừng
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages (lấy site/base đúng theo repo)
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tự bật GitHub Pages (chế độ GitHub Actions) nếu repo chưa bật —
          # không cần thao tác tay trong Settings → Pages. Yêu cầu repo public.
          enablement: true

      - name: Install
        run: npm ci

      - name: Provenance — _source/ phải bất biến
        run: node tools/check-source-hashes.mjs

      - name: Tin tức — lấy tin mới từ nguồn chọn lọc (lỗi nguồn KHÔNG chặn deploy)
        run: node tools/fetch-news.mjs || echo "fetch-news lỗi — dùng dữ liệu tin sẵn có"

      - name: Validate — cây legacy + schema nội dung
        run: |
          node tools/build-search-index.mjs
          node tools/validate-legacy.mjs
          npx astro check

      - name: Build (site/base tự lấy từ cấu hình Pages của repo)
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npx astro build
          node tools/postbuild.mjs

      - name: Validate — output build (link, draft, hạ tầng)
        run: node tools/validate-dist.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
