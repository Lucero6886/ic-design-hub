<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 570" width="1220" height="570" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-label="Sơ đồ khối mức đỉnh của traffic_system_top">
<title>Hình 1 — Sơ đồ khối mức đỉnh (traffic_system_top)</title>
<desc>tick_gen tạo xung enable tick 1 Hz đưa tới cả traffic_ctrl và status_tx. traffic_ctrl xuất ns_light và ew_light ra LED đèn, xuất time_left tới seg7_decoder và status_tx, xuất phase tới status_tx. status_tx bắt tay với uart_tx qua tx_start và tx_data, nhận phản hồi tx_busy. uart_tx xuất tx ra PC. clk và rst_n đi tới mọi khối tuần tự; seg7_decoder là mạch tổ hợp nên không có clk.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<style>
  .box{fill:#fff;stroke:#334155;stroke-width:2}
  .core{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2.5}
  .inner{stroke-width:1.5}
  .ctrl{fill:#dbeafe;stroke:#2563eb}
  .dpath{fill:#dcfce7;stroke:#059669}
  .mname{font-size:15.5px;font-weight:700;fill:#0f172a}
  .mrole{font-size:11px;fill:#475569}
  .inname{font-size:11.5px;font-weight:800;fill:#0f172a}
  .sig{stroke:#1d4ed8;stroke-width:2;fill:none}
  .fb{stroke:#b45309;stroke-width:2;fill:none}
  .clk{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  .lbl{font-size:11.5px;fill:#1e3a8a;font-family:ui-monospace,Consolas,monospace}
  .lblf{font-size:11.5px;fill:#92400e;font-family:ui-monospace,Consolas,monospace}
  .lblc{font-size:11.5px;fill:#64748b;font-family:ui-monospace,Consolas,monospace}
  .cap{font-size:10.5px;fill:#64748b}
  .io{font-size:12.5px;fill:#0f172a;font-weight:700}
  .note{font-size:11px;fill:#b91c1c}
  .lbg{fill:#fff;opacity:.92}
  .wk{font-size:9.5px;font-weight:800;fill:#fff}
</style>

<!-- ================= KHỐI ================= -->
<rect class="box" x="80" y="200" width="140" height="64" rx="10"/>
<text class="mname" x="150" y="228" text-anchor="middle">tick_gen</text>
<text class="mrole" x="150" y="245" text-anchor="middle">counter chia tần</text>
<rect x="80" y="200" width="32" height="15" rx="7" fill="#2563eb"/><text class="wk" x="96" y="211" text-anchor="middle">T9</text>

<rect class="box core" x="310" y="140" width="230" height="185" rx="12"/>
<text class="mname" x="425" y="166" text-anchor="middle">traffic_ctrl</text>
<rect class="inner ctrl" x="322" y="180" width="100" height="54" rx="7"/>
<text class="inname" x="372" y="200" text-anchor="middle">CONTROLLER</text>
<text class="mrole" x="372" y="216" text-anchor="middle">FSM 4 pha</text>
<rect class="inner dpath" x="430" y="180" width="98" height="54" rx="7"/>
<text class="inname" x="479" y="200" text-anchor="middle">DATAPATH</text>
<text class="mrole" x="479" y="216" text-anchor="middle">timer đếm lùi</text>
<text class="cap" x="425" y="258" text-anchor="middle">bên trong: xem Hình 2</text>
<text class="cap" x="425" y="300" text-anchor="middle">hợp đồng interface cố định từ Tuần 9</text>
<rect x="310" y="140" width="32" height="15" rx="7" fill="#2563eb"/><text class="wk" x="326" y="151" text-anchor="middle">T9</text>

<rect class="box" x="690" y="52" width="175" height="60" rx="10"/>
<text class="mname" x="777" y="79" text-anchor="middle">seg7_decoder</text>
<text class="mrole" x="777" y="96" text-anchor="middle">giải mã BCD → 7 đoạn</text>
<rect x="690" y="52" width="38" height="15" rx="7" fill="#059669"/><text class="wk" x="709" y="63" text-anchor="middle">T10</text>

<rect class="box" x="690" y="290" width="175" height="66" rx="10"/>
<text class="mname" x="777" y="317" text-anchor="middle">status_tx</text>
<text class="mrole" x="777" y="334" text-anchor="middle">ghép 6 byte "GN 09"</text>
<rect x="690" y="290" width="38" height="15" rx="7" fill="#7c3aed"/><text class="wk" x="709" y="301" text-anchor="middle">T11</text>

<rect class="box" x="965" y="290" width="135" height="66" rx="10"/>
<text class="mname" x="1032" y="317" text-anchor="middle">uart_tx</text>
<text class="mrole" x="1032" y="334" text-anchor="middle">FSM + shift register</text>
<rect x="965" y="290" width="38" height="15" rx="7" fill="#7c3aed"/><text class="wk" x="984" y="301" text-anchor="middle">T11</text>

<!-- ================= clk / rst_n ================= -->
<path class="clk" d="M60 470 H1090"/>
<path class="clk" d="M150 470 V264" marker-end="url(#ahg)"/>
<path class="clk" d="M470 470 V325" marker-end="url(#ahg)"/>
<path class="clk" d="M700 470 V356" marker-end="url(#ahg)"/>
<path class="clk" d="M1060 470 V356" marker-end="url(#ahg)"/>
<text class="io" x="18" y="466">clk, rst_n</text>
<path class="clk" d="M50 462 H60"/>
<text class="lblc" x="150" y="488">MỘT miền clock duy nhất — mọi flip-flop trong hệ đều đóng theo cùng cạnh lên của clk</text>

<!-- ghi chú seg7 tổ hợp -->
<text class="note" x="690" y="134">⚠ seg7_decoder KHÔNG có clk, KHÔNG có flip-flop —</text>
<text class="note" x="690" y="149">là mạch tổ hợp thuần: output chỉ phụ thuộc bcd hiện tại.</text>

<!-- ================= tick ================= -->
<path class="sig" d="M220 232 H310" marker-end="url(#ah)"/>
<rect class="lbg" x="234" y="214" width="56" height="14"/>
<text class="lbl" x="236" y="225">tick [1]</text>
<circle cx="255" cy="232" r="4.5" fill="#1d4ed8"/>
<path class="sig" d="M255 232 V420 H662 V346 H690" marker-end="url(#ah)"/>
<rect class="lbg" x="292" y="400" width="330" height="14"/>
<text class="lbl" x="294" y="411">tick [1] — cùng một xung enable cho cả hai khối</text>

<!-- ================= ns/ew light ================= -->
<path class="sig" d="M390 140 V28 H1120" marker-end="url(#ah)"/>
<rect class="lbg" x="596" y="12" width="190" height="14"/>
<text class="lbl" x="598" y="23">ns_light [3], ew_light [3]</text>
<text class="io" x="1126" y="33">LED đèn</text>

<!-- ================= time_left ================= -->
<path class="sig" d="M540 205 H600 V82 H690" marker-end="url(#ah)"/>
<circle cx="600" cy="205" r="4.5" fill="#1d4ed8"/>
<path class="sig" d="M600 205 H635 V318 H690" marker-end="url(#ah)"/>
<rect class="lbg" x="546" y="188" width="92" height="14"/>
<text class="lbl" x="548" y="199">time_left [4]</text>
<text class="cap" x="608" y="170">→ tới hiển thị</text>
<text class="cap" x="643" y="262">→ tới UART</text>

<!-- ================= phase ================= -->
<path class="sig" d="M540 265 H660 V331 H690" marker-end="url(#ah)"/>
<rect class="lbg" x="546" y="248" width="68" height="14"/>
<text class="lbl" x="548" y="259">phase [2]</text>

<!-- ================= seg out ================= -->
<path class="sig" d="M865 82 H1120" marker-end="url(#ah)"/>
<rect class="lbg" x="946" y="66" width="56" height="14"/>
<text class="lbl" x="948" y="77">seg [7]</text>
<text class="io" x="1126" y="87">LED 7 đoạn</text>

<!-- ================= handshake ================= -->
<path class="sig" d="M865 306 H965" marker-end="url(#ah)"/>
<rect class="lbg" x="874" y="288" width="84" height="14"/>
<text class="lbl" x="876" y="299">tx_start [1]</text>
<path class="sig" d="M865 326 H965" marker-end="url(#ah)"/>
<rect class="lbg" x="874" y="336" width="80" height="14"/>
<text class="lbl" x="876" y="347">tx_data [8]</text>
<path class="fb" d="M1000 356 V400 H760 V356" marker-end="url(#ahf)"/>
<rect class="lbg" x="778" y="404" width="270" height="14"/>
<text class="lblf" x="780" y="415">tx_busy [1] — phản hồi "đang bận, chờ"</text>

<!-- ================= tx out ================= -->
<path class="sig" d="M1100 323 H1160" marker-end="url(#ah)"/>
<rect class="lbg" x="1104" y="304" width="44" height="14"/>
<text class="lbl" x="1106" y="315">tx [1]</text>
<text class="io" x="1104" y="347">→ PC</text>

<!-- ================= CHÚ GIẢI ================= -->
<rect x="20" y="502" width="1180" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="cap" x="34" y="519" font-weight="700" fill="#334155">QUY ƯỚC ĐỌC SƠ ĐỒ</text>
<path class="sig" d="M180 515 H220" marker-end="url(#ah)"/>
<text class="lblc" x="228" y="519">đường tín hiệu — [n] là độ rộng bit</text>
<path class="fb" d="M560 515 H600" marker-end="url(#ahf)"/>
<text class="lblc" x="608" y="519">đường phản hồi (handshake)</text>
<path class="clk" d="M880 515 H920" marker-end="url(#ahg)"/>
<text class="lblc" x="928" y="519">clk / rst_n</text>
<circle cx="196" cy="543" r="4.5" fill="#1d4ed8"/>
<text class="lblc" x="228" y="547">chấm tròn = ĐIỂM NỐI (một nguồn chia cho nhiều đích)</text>
<path class="sig" d="M676 536 H716"/><path class="sig" d="M696 528 V552"/>
<text class="lblc" x="728" y="547">hai đường cắt nhau KHÔNG có chấm = không nối</text>
</svg>
